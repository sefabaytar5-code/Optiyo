<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Optiyo Demo</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
      --muted: #94a3b8; --accent: #3b82f6; --green: #22c55e; --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      position: sticky; top: 0; background: #0f172aee; border-bottom: 1px solid var(--border);
      padding: 12px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; z-index: 10;
    }
    h1 { font-size: 1.1rem; } h1 span { color: var(--accent); }
    .spacer { flex: 1; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 8px;
      padding: 8px 12px; font-weight: 600; font-size: 0.85rem;
    }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    main { max-width: 640px; margin: 0 auto; padding: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; margin-bottom: 10px;
    }
    .product { display: flex; gap: 12px; cursor: pointer; }
    .thumb {
      width: 64px; height: 64px; border-radius: 8px; background: #0f172a;
      display: flex; align-items: center; justify-content: center; font-size: 1.6rem; flex-shrink: 0;
    }
    .name { font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
    .badge {
      display: inline-block; margin-top: 6px; background: #1d4ed8; color: #fff;
      font-size: 0.72rem; padding: 2px 8px; border-radius: 999px;
    }
    .search { display: flex; gap: 8px; margin-bottom: 12px; }
    input {
      flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 10px; font-size: 1rem;
    }
    .hidden { display: none !important; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .price-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .price-row:last-child { border-bottom: 0; }
    .price { color: var(--green); font-weight: 700; font-size: 1.05rem; }
    .note {
      background: #172554; border: 1px solid #1e40af; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 14px; font-size: 0.85rem; color: #bfdbfe;
    }
    footer { text-align: center; padding: 20px; color: var(--muted); font-size: 0.75rem; }
  </style>
</head>
<body>
  <header>
    <h1>Opt<span>iyo</span> <small style="font-weight:400;color:#94a3b8;font-size:0.75rem">Demo</small></h1>
    <div class="spacer"></div>
    <button type="button" class="ghost" id="btnHome">Ürünler</button>
    <button type="button" class="ghost" id="btnSearch">Ara</button>
  </header>

  <main>
    <div class="note">
      Bu sürüm <strong>bilgisayarsız demo</strong>dur. Veriler telefonda gömülü örnek ürünlerdir; gerçek mağaza API’si yoktur.
    </div>

    <section id="listView">
      <div class="search">
        <input id="q" type="search" placeholder="Ürün ara…" />
        <button type="button" id="goSearch">Ara</button>
      </div>
      <div id="list"></div>
    </section>

    <section id="detailView" class="hidden">
      <button type="button" class="ghost" id="btnBack" style="margin-bottom:12px">← Geri</button>
      <div id="detail"></div>
    </section>
  </main>

  <footer>Optiyo Demo · Backend yok · Sadece arayüz</footer>

  <script>
    // Örnek (sahte) ürünler — API yok
    var PRODUCTS = [
      {
        id: "1",
        name: "iPhone 15 128 GB",
        brand: "Apple",
        category: "Telefon",
        emoji: "📱",
        score: 88,
        prices: [
          { store: "Trendyol", price: 42999 },
          { store: "Hepsiburada", price: 43499 },
          { store: "Amazon", price: 43999 }
        ]
      },
      {
        id: "2",
        name: "Samsung Galaxy A55",
        brand: "Samsung",
        category: "Telefon",
        emoji: "📲",
        score: 76,
        prices: [
          { store: "Trendyol", price: 18999 },
          { store: "Hepsiburada", price: 19249 }
        ]
      },
      {
        id: "3",
        name: "AirPods Pro 2",
        brand: "Apple",
        category: "Kulaklık",
        emoji: "🎧",
        score: 91,
        prices: [
          { store: "Trendyol", price: 8999 },
          { store: "Amazon", price: 8799 },
          { store: "Hepsiburada", price: 9099 }
        ]
      },
      {
        id: "4",
        name: "Dyson V15 Detect",
        brand: "Dyson",
        category: "Ev",
        emoji: "🧹",
        score: 84,
        prices: [
          { store: "Hepsiburada", price: 27999 },
          { store: "Trendyol", price: 28499 }
        ]
      },
      {
        id: "5",
        name: "Nescafe Gold 200g",
        brand: "Nescafe",
        category: "Market",
        emoji: "☕",
        score: 70,
        prices: [
          { store: "Migros", price: 289 },
          { store: "Trendyol", price: 275 }
        ]
      }
    ];

    function $(id) { return document.getElementById(id); }

    function card(p) {
      return (
        '<div class="card product" data-id="' + p.id + '">' +
          '<div class="thumb">' + p.emoji + '</div>' +
          '<div><div class="name">' + p.name + '</div>' +
          '<div class="sub">' + p.brand + " · " + p.category + "</div>" +
          '<span class="badge">Skor ' + p.score + "</span></div></div>"
      );
    }

    function renderList(items) {
      var box = $("list");
      if (!items.length) {
        box.innerHTML = '<p class="muted">Sonuç yok</p>';
        return;
      }
      box.innerHTML = items.map(card).join("");
      box.querySelectorAll(".product").forEach(function (el) {
        el.onclick = function () { openDetail(el.getAttribute("data-id")); };
      });
    }

    function openDetail(id) {
      var p = PRODUCTS.filter(function (x) { return x.id === id; })[0];
      if (!p) return;
      $("listView").classList.add("hidden");
      $("detailView").classList.remove("hidden");
      var min = Math.min.apply(null, p.prices.map(function (x) { return x.price; }));
      var rows = p.prices.map(function (x) {
        var best = x.price === min ? ' <span class="badge">En ucuz</span>' : "";
        return (
          '<div class="price-row"><span>' + x.store + best +
          '</span><span class="price">' + x.price.toLocaleString("tr-TR") + " ₺</span></div>"
        );
      }).join("");
      $("detail").innerHTML =
        '<div class="card"><div class="thumb" style="width:80px;height:80px;font-size:2rem;margin-bottom:10px">' +
        p.emoji + "</div>" +
        "<h2 style='font-size:1.2rem'>" + p.name + "</h2>" +
        '<p class="sub">' + p.brand + " · " + p.category + "</p>" +
        '<span class="badge">Skor ' + p.score + "</span></div>" +
        '<div class="card"><div class="name" style="margin-bottom:8px">Fiyatlar (örnek)</div>' +
        rows + "</div>" +
        '<p class="muted" style="margin-top:10px">Not: Linkler demo; gerçek mağaza yönlendirmesi yok.</p>';
    }

    function showList() {
      $("detailView").classList.add("hidden");
      $("listView").classList.remove("hidden");
      var q = ($("q").value || "").trim().toLowerCase();
      var items = PRODUCTS.filter(function (p) {
        if (!q) return true;
        return (p.name + p.brand + p.category).toLowerCase().indexOf(q) !== -1;
      });
      renderList(items);
    }

    $("btnHome").onclick = function () { $("q").value = ""; showList(); };
    $("btnSearch").onclick = function () { $("q").focus(); };
    $("goSearch").onclick = showList;
    $("q").onkeydown = function (e) { if (e.key === "Enter") showList(); };
    $("btnBack").onclick = showList;

    showList();
  </script>
</body>
</html>
